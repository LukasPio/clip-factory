[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-factory-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "SQLAlchemy>=2.0.41,<2.1",
  "filelock>=3.18,<5",
  "faster-whisper==1.1.1",
  "huggingface-hub==0.36.0",
  "numpy>=1.26,<3",
  "onnxruntime>=1.14,<2",
  "yt-dlp[default]>=2026.10.26,<2027",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]
build = ["pyinstaller>=6.12,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_download: downloads and probes real videos from external platforms"]
